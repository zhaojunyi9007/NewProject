# Reuse common defaults
_base: base.yaml

# EdgeCalib v2.0 - OSDaR23 数据集配置
# 使用方式: python run_pipeline.py --config configs/osdar23.yaml --frame-ids 12

# ========================================
# 数据路径配置
# ========================================
data:
  dataset_format: "osdar23"
  # ★ 修改这里指向你的序列根目录
  osdar_sequence_root: "/gz-data/OSDaR23/1_calibration_1.1"
  image_sensor: "rgb_center"        # rgb_center / rgb_left / rgb_right
  osdar_duplicate_policy: "latest"  # latest | earliest

  # 以下三项由 osdar_sequence_root 自动推导，留空即可
  image_dir: ""
  velodyne_dir: ""
  calib_file: ""

  # 输出目录（独立于 KITTI 的 result/，避免混淆）
  result_dir: "result_osdar23"
  sam_output_dir: "result_osdar23/sam_features"
  lidar_output_dir: "result_osdar23/lidar_features"
  calib_output_dir: "result_osdar23/calibration"
  visual_output_dir: "result_osdar23/visualization"
  image_features_output_dir: "result_osdar23/image_features"
  label_features_output_dir: "result_osdar23/label_features"
  bev_init_output_dir: "result_osdar23/bev_init"
  refinement_output_dir: "result_osdar23/refinement"

# OSDaR23 数据集元信息（供 BEV / 语义流水线使用）
dataset:
  reference_plane: rail_top
  reference_z: 0.0

# ========================================
# 帧选择配置
# ========================================
frames:
  # frames.mode=all 时由 OSDaRResolver 自动枚举 counter；
  # 建议调试时先用 select + 单帧
  mode: "select"
  frame_ids: [12]
  fusion_window: 1   # 单帧验证时设为 1；多帧融合建议 3~5

sam:
  mask_alignment:
    output_dir: "result_osdar23/mask_alignment"

# Phase 1+ 图像 / BEV / 语义标定覆盖（算法占位阶段默认仍关闭，与 base 一致）
image_features:
  bottom_crop_ratio_for_edges: 0.0
  enable_lines: false
  enable_rail_region: true
  rail_seed_threshold: 0.42
  rail_support_threshold: 0.22
  rail_mask_min_area: 500
  rail_close_kernel: 9
  rail_open_kernel: 5
  rail_top_ignore_ratio: 0.05
  rail_bottom_keep_ratio: 0.95
  rail_component_min_height_ratio: 0.05
  rail_skeleton_min_length_px: 50
  rail_dist_max_ratio: 0.08
  rail_weight_dilate_kernel: 11
  rail_refinement:
    enabled: true
    method: "sam_steger_vp"
    use_label_track_prior: true
    label_track_prior_weight: 0.80
    label_track_dilate_px: 31
    label_track_blur_sigma_px: 7
    label_track_min_valid_ratio: 0.0001
    label_track_output_lines: "all"
    label_track_main_pair_for_quality: true
    label_track_steger_search_radius_px: 10
    label_track_polyline_sample_step_px: 3
    label_track_steger_min_score: 0.0
    use_lidar_bev_prior: true
    lidar_prior_weight: 0.12
    sam_prior_weight: 0.04
    steger_response_weight: 0.04
    track_gauge_m: 1.435
    track_gauge_tolerance_m: 0.45
    lidar_prior_project_sigma_px: 7
    candidate_roi_dilate_px: 45
    weak_roi_threshold: 0.06
    steger_sigma: 1.2
    min_response: 0.025
    max_subpixel_offset: 0.65
    clahe_clip_limit: 2.5
    min_curve_length_px: 160
    min_mean_rail_prob: 0.06
    vp_angle_thresh_deg: 12.0
    min_line_count: 2
    prefer_main_pair: true
    max_output_lines: 4
    min_total_length_px: 400
    min_quality_score: 0.42

bev:
  x_range: [0.0, 100.0]
  y_range: [-25.0, 25.0]
  z_range: [-1.5, 6.0]
  resolution: 0.05
  use_rail_plane_prior: true
  near_ground_band: [-0.25, 0.35]
  image_rail_source: "label_track"
  image_rail_threshold: 0.20
  image_rail_dilate_cells: 2
  image_rail_blur_sigma_cells: 1.0
  min_rail_score_to_apply: 0.001
  oracle_min_quality_score: 0.8
  oracle_min_rail_score_to_apply: 0.001
  oracle_max_abs_tx_m: 2.0
  oracle_max_abs_ty_m: 1.0
  oracle_max_abs_yaw_deg: 3.0
  use_refined_lidar_rail: true
  auto_test_bev_axis_transforms: true
  rail_alignment_min_overlap: 0.15
  rail_alignment_max_shift_cells: 120
  matcher_score_mode: weighted_chamfer
  chamfer_sigma_m: 0.8
  chamfer_distance_cap_m: 2.5
  min_lidar_rail_weight_sum: 20.0


label_assist:
  enabled: true
  mode: simulation_teacher
  use_for_image_prior: true
  use_for_lidar_prior: true
  use_for_calib_residual: true
  export_diagnostics: true
  strong_features_enabled: true
  track_weight: 2.0
  catenary_pole_weight: 1.5
  switch_weight: 1.2
  buffer_stop_weight: 1.0
  static_object_weight: 1.0
  vehicle_weight: 0.4
  person_weight: 0.2
  max_track_samples_per_object: 800
  max_pole_samples_per_object: 20
  bbox_padding_px: 12
  label_json: ""
  teacher_visible_xmax_m: 120.0
  teacher_image_bbox_padding_m: 8.0
  use_sam_refine: true

semantic_calib:
  rail_weight: 1.5
  vehicle_object_weight: 0.8
  person_object_weight: 0.5
  min_label_teacher_score: 0.20
  min_strong_label_score: 0.25
  min_strong_track_residual_count: 50
  min_strong_static_residual_count: 2
  min_label_track_visible_count: 50
  min_label_residual_count_for_gate: 50
  label_assist_requires_label_gate: true
  use_rejected_bev_as_label_candidate: false
  enable_init_candidate_scoring: true
  max_label_assisted_pose_jump_m: 1.0
  max_label_assisted_yaw_jump_deg: 3.0
  allow_object_or_edge_to_pass_rail_gate: true
  min_final_object_visible_count: 1
  min_final_semantic_hist_similarity: 0.05
  max_final_semantic_js_divergence: 0.95
  oracle_rail_weight: 2.0
  oracle_rail_weight_fallback: 0.2
  semantic_js_weight: 2.0
  histogram_weight: 0.3
  edge_weight: 0.7
  use_lidar_bev_rail_samples: true
  lidar_bev_rail_sample_min_prob: 0.15
  lidar_bev_rail_sample_stride_cells: 2
  lidar_bev_rail_sample_max_points: 8000
  min_lidar_bev_rail_samples: 200
  lidar_bev_oracle_overlap_dilate_cells: 3
  lidar_bev_rail_min_component_cells: 20
  lidar_bev_crop_to_image_valid: true
  lidar_bev_crop_to_image_rail_bbox: true
  lidar_bev_image_rail_bbox_padding_m: 8.0
  oracle_rail_hard_gate: true
  min_final_rail_visible_ratio: 0.08
  min_final_rail_visible_count: 50
  reject_pose_on_rail_gate_fail: true
  lidar_semantic_max_points: 3000
  stratified_semantic_sampling: true
  rail_early_reject_enabled: true
  rail_early_reject_visible_ratio: 0.02
  rail_early_reject_visible_count: 10
  optimizer_num_threads: 0
  use_fallback_rail_samples_when_mismatch: false
  skip_optimizer_on_rail_refinement_mismatch: true
  rail_low_visible_policy: "penalty"
  min_rail_visible_count: 50
  min_rail_visible_ratio: 0.08
  rail_low_visible_penalty: 0.50
  rail_visibility_residual_weight: 0.15
  rail_oob_residual_weight: 0.20
  edge_low_visible_policy: "zero"
  min_edge_visible_count: 50
  edge_low_visible_penalty: 0.15
  min_image_rail_quality: 0.42
  low_image_rail_quality_weight: 0.0
  # Phase C6: suppress rail term on switch/low-confidence rail extraction frames.
  # - When LiDAR Phase3 reports branch_detected=true OR rail_confidence < min_rail_confidence_for_weight,
  #   the optimizer will use branch_rail_weight instead of rail_weight.
  min_rail_confidence_for_weight: 0.5
  branch_rail_weight: 0.0
  class_weights:
    rail: 4.0
    ballast: 2.0
    pole: 2.0
    signal: 2.5
    platform: 2.0
    building: 1.2
    road: 0.6
    vehicle: 1.0
    person: 1.0
    vegetation: 0.2
    sky: 0.0

visualization:
  pose_source: "refined"
  reject_invalid_pose: true
  invalid_pose_fallback: "initial"

refine:
  skip_invalid_calibration_pose: true

# ========================================
# LiDAR 特征提取配置（针对 OSDaR23 点云密度微调）
# ========================================
lidar:
  voxel_size: 0.25
  normal_k: 30
  pca_radius: 0.6
  ground_z_min: -2.5
  ground_z_max: 0.4
  rail_ransac_threshold: 0.08
  rail_max_lines: 2
  pole_z_min: -1.0
  pole_z_max: 3.5
  pole_ransac_threshold: 0.15
  pole_vertical_tolerance: 0.15
  pole_max_lines: 60
  edge_source: "range_depth"
  edge_max_range_m: 45.0
  edge_min_z: -0.5
  edge_max_z: 4.0
  edge_keep_near_track_only: true
  edge_track_y_margin_m: 8.0
  edge_cluster_min_size: 5
  vertical_enable_for_optimizer: false
  vertical_max_range_m: 45.0
  vertical_min_height_m: 1.2
  vertical_max_radius_m: 0.45
  vertical_min_linearity: 0.55
  vertical_min_verticality: 0.75
  vertical_max_plane_extent_m: 1.0
  vertical_max_lines: 32
  ndt:
    transformation_epsilon: 0.01
    step_size: 0.1
    resolution: 1.0
    max_iterations: 35
  temporal_filter:
    position_threshold: 0.3
    static_weight: 0.9
    dynamic_weight: 0.1
  phase3:
    enabled: true
    save_semantic_points: true
    save_bev_maps: true
    reference_plane_z: 0.0
    rail_band_zmin: -0.5
    rail_band_zmax: 0.5
    bev_xmin: 0.0
    bev_xmax: 100.0
    bev_ymin: -25.0
    bev_ymax: 25.0
    bev_resolution: 0.2
    rail_geometry:
      min_length_m: 8.0
      max_width_m: 1.2
      min_linearity: 8.0
      gauge_m: 1.435
      gauge_tolerance_m: 0.45
      max_parallel_angle_deg: 5.0
      min_pair_overlap_m: 5.0
      local_ground_window_cells: 4
      ground_percentile: 0.10
      rail_residual_min_m: 0.03
      rail_residual_max_m: 0.30
      max_candidate_height_range_m: 0.55
      linearity_window_cells: 3
      morph_open_kernel_cells: 1
      hough_min_line_length_m: 8.0
      hough_max_line_gap_m: 1.2
      accepted_line_band_m: 0.35
      blob_max_width_m: 1.8
      blob_max_fill_ratio: 0.45
      blob_max_area_cells: 3500

# ========================================
# 标定优化配置
# ========================================
calibration:
  # 初始外参由 OSDaR23 calibration.txt 自动读取，这里作为 fallback
  initial_extrinsic:
    rotation: [0.0, 0.0, 0.0]
    translation: [0.0, 0.0, 0.0]

  ab_experiment:
    opt_translation: true
    t_prior_weight: 20
    w_consistency: 0.0
    coarse_angle_range: 0.12
    coarse_angle_step: 0.06
    coarse_tx_range: 0.30
    coarse_tx_step: 0.10
    coarse_ty_range: 0.40
    coarse_ty_step: 0.20
    coarse_tz_range: 0.30
    coarse_tz_step: 0.15
    fine_margin_switch_inimage: 0.15
    fine_margin_low: 4
    fine_margin_high: 12
    t_prior_disable_inimage_thresh: 0.05
    t_prior_weaken_inimage_thresh: 0.15
    t_prior_weaken_factor: 0.35
    t_prior_disable_oob_thresh: 0.70
    t_prior_weaken_oob_thresh: 0.45
    t_prior_weaken_oob_factor: 0.35
    log_line_debug: false

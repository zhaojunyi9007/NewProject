# EdgeCalib v2.0 - Base config shared by datasets
#
# Dataset-specific configs should include this file via:
#   _base: base.yaml

# ========================================
# 输出路径（所有结果统一保存在 result_dir 下）
# ========================================
data:
  result_dir: "result"
  sam_output_dir: "result/sam_features"
  lidar_output_dir: "result/lidar_features"
  calib_output_dir: "result/calibration"
  visual_output_dir: "result/visualization"
  # Phase 1+ 扩展输出目录（与 result_dir 组合使用，可由数据集配置覆盖）
  image_features_output_dir: "result/image_features"
  bev_init_output_dir: "result/bev_init"
  refinement_output_dir: "result/refinement"

# ========================================
# 帧选择配置
# ========================================
frames:
  mode: "select"
  frame_ids: [0]
  fusion_window: 3

# ========================================
# SAM 特征提取配置
# ========================================
sam:
  checkpoint_path: "/gz-data/model/sam_vit_h_4b8939.pth"
  model_type: "vit_h"
  feature_plugin: "sam_subprocess"
  points_per_side: 16
  pred_iou_thresh: 0.86
  stability_score_thresh: 0.92
  min_mask_region_area: 500
  heuristics:
    min_mask_area_ratio: 0.001
    max_background_area_ratio: 0.15
    sky_mask_bottom_ratio: 0.3
    ground_region_top_ratio: 0.5
    flat_ground_aspect_ratio: 3.0
    structural_aspect_ratio: 3.0
    contour_stddev_threshold: 10.0
    min_arc_length_ratio: 0.06
    sky_min_line_length_ratio: 0.03
    fused_top_black_ratio: 0.20
    fused_bottom_black_ratio: 0.80
    distance_max_ratio: 0.15
  mask_alignment:
    enabled: false
    output_dir: "result/mask_alignment"

# ========================================
# LiDAR 特征提取配置
# ========================================
lidar:
  voxel_size: 0.1
  normal_k: 20
  pca_radius: 0.5
  ground_z_min: -3.0
  ground_z_max: -1.5
  rail_ransac_threshold: 0.15
  rail_max_lines: 2
  pole_z_min: -1.0
  pole_z_max: 5.0
  pole_ransac_threshold: 0.2
  pole_vertical_tolerance: 0.2
  pole_max_lines: 5
  ndt:
    enabled: true
    transformation_epsilon: 0.01
    step_size: 0.1
    resolution: 1.0
    max_iterations: 30
  temporal_filter:
    enabled: true
    # 3D 空间位置一致性阈值（单位：m）。越小越严格，会更容易剔除跨帧不一致的点/线。
    position_threshold: 0.5
    # 投影一致性阈值（单位：m，使用到“投影距离/球面投影”度量的那一路过滤）。
    # 经验上可与 position_threshold 保持同量级；若轨道/边缘在图像中抖动较大，可适当调大。
    projection_threshold: 0.5
    static_weight: 1.0
    dynamic_weight: 0.1
  # Phase 3：LiDAR-BEV、语义点、BEV 轨/聚类立柱（由 lidar_extractor 新路径生成）
  phase3:
    enabled: false
    save_semantic_points: true
    save_bev_maps: true
    reference_plane_z: 0.0
    rail_band_zmin: -0.5
    rail_band_zmax: 0.5
    bev_xmin: 0.0
    bev_xmax: 100.0
    bev_ymin: -25.0
    bev_ymax: 25.0
    bev_resolution: 0.2
    rail_bev_prob_thresh: 0.05
    rail_bev_min_cells: 40.0
    rail_bev_smooth_k: 1
    rail_bev_max_segments: 6
    rail_geometry:
      min_length_m: 8.0
      max_width_m: 1.2
      min_linearity: 8.0
      gauge_m: 1.435
      gauge_tolerance_m: 0.45
      max_parallel_angle_deg: 5.0
      min_pair_overlap_m: 5.0
      local_ground_window_cells: 4
      ground_percentile: 0.10
      rail_residual_min_m: 0.03
      rail_residual_max_m: 0.30
      max_candidate_height_range_m: 0.55
      linearity_window_cells: 3
      morph_open_kernel_cells: 1
      hough_min_line_length_m: 8.0
      hough_max_line_gap_m: 1.2
      accepted_line_band_m: 0.35
      blob_max_width_m: 1.8
      blob_max_fill_ratio: 0.45
      blob_max_area_cells: 3500
    vert_cluster_tolerance: 0.35
    vert_min_cluster: 25
    use_legacy_range_image: false
    bev_edge_gradient_ratio: 0.35

# ========================================
# 标定优化配置
# ========================================
calibration:
  constraint_adapter: "legacy_env_constraints"
  extrinsic_init:
    target_camera: "rgb_center"
  initial_extrinsic:
    rotation: [0.0, 0.0, 0.0]
    translation: [0.0, -0.3, 1.8]
  temporal_validation:
    enabled: false
    smoothness_threshold: 0.05
    history_frames: 3
    min_confidence: 0.7
    history_file: "calib_history.txt"
  ab_experiment:
    opt_translation: true
    t_prior_weight: 20
    w_consistency: 0.0
    coarse_angle_range: 0.15
    coarse_angle_step: 0.05
    coarse_tx_range: 0.10
    coarse_tx_step: 0.05
    coarse_ty_range: 0.30
    coarse_ty_step: 0.15
    coarse_tz_range: 0.30
    coarse_tz_step: 0.15
    fine_margin_switch_inimage: 0.03
    fine_margin_low: 400
    fine_margin_high: 400
    t_prior_disable_inimage_thresh: 0.03
    t_prior_weaken_inimage_thresh: 0.08
    t_prior_weaken_factor: 0.1
    t_prior_disable_oob_thresh: 0.65
    t_prior_weaken_oob_thresh: 0.35
    t_prior_weaken_oob_factor: 0.1
    log_line_debug: false

# ========================================
# 可视化配置
# ========================================
visualization:
  # Phase 7：额外生成 BEV/语义/精修诊断拼图
  enable_diag_panels: true
  point_size: 2
  line_width: 2
  show_edges: true
  show_lines: true
  show_projections: true

# ========================================
# 图像特征前端（语义优先流水线；默认关闭以保持旧行为）
# ========================================
image_features:
  enabled: true
  enable_semantic_probs: true
  enable_edges: true
  enable_lines: false
  enable_rail_region: true
  semantic_classes: [rail, ballast, pole, signal, platform, building, road, vehicle, person, vegetation, sky]
  save_logits: true
  rail_class_names: [rail, ballast]
  vertical_structure_classes: [pole, signal]
  bottom_crop_ratio_for_edges: 0.0
  # Phase 0 (sam_2d): rail region / centerline params (LSD removed as main rail feature)
  rail_seed_threshold: 0.42
  rail_support_threshold: 0.22
  rail_mask_min_area: 400
  rail_close_kernel: 9
  rail_open_kernel: 5
  rail_top_ignore_ratio: 0.18
  rail_bottom_keep_ratio: 0.75
  rail_component_min_height_ratio: 0.05
  rail_skeleton_min_length_px: 40
  rail_dist_max_ratio: 0.08
  rail_weight_dilate_kernel: 9
  rail_refinement:
    enabled: true
    method: "sam_steger_vp"
    weak_roi_threshold: 0.08
    steger_sigma: 1.4
    min_response: 0.03
    max_subpixel_offset: 0.6
    clahe_clip_limit: 2.0
    clahe_tile_grid: 8
    candidate_connect_kernel: 3
    min_curve_length_px: 120
    max_curve_samples: 900
    min_mean_rail_prob: 0.08
    vp_angle_thresh_deg: 10.0
    min_line_count: 2
    prefer_main_pair: true
    max_output_lines: 2
    min_total_length_px: 1200
    min_quality_score: 0.45
    fit_poly_degree: 2
    polyline_sample_step_px: 2.0
    polyline_clip_pad_px: 4

# ========================================
# BEV 粗初始化（默认关闭）
# ========================================
bev:
  enabled: true
  x_range: [0.0, 80.0]
  y_range: [-20.0, 20.0]
  z_range: [-2.0, 5.0]
  resolution: 0.1
  channels: [density, max_height, min_height, mean_height, intensity, verticality, rail_prob]
  optimize_dofs: [yaw, tx, ty]
  rail_prior_weight: 1.0
  pole_prior_weight: 0.6
  # Phase 4：bev_initializer 搜索范围（度 / 米），可由环境变量 EDGECALIB_BEV_* 覆盖
  yaw_min_deg: -6.0
  yaw_max_deg: 6.0
  yaw_step_deg: 1.0
  tx_min_m: -2.0
  tx_max_m: 2.0
  ty_min_m: -2.0
  ty_max_m: 2.0
  trans_step_m: 0.5
  matcher_score_mode: weighted_chamfer
  chamfer_sigma_m: 0.8
  chamfer_distance_cap_m: 2.5
  min_lidar_rail_weight_sum: 20.0
  initializer_binary: ""
  # 低于此 rail_score 时拒绝应用 BEV delta，保留原始 init_pose
  min_rail_score_to_apply: 0.01

# ========================================
# 语义概率场标定（默认关闭）
# ========================================

label_assist:
  enabled: false
  mode: simulation_teacher
  use_for_image_prior: true
  use_for_lidar_prior: true
  use_for_calib_residual: true
  export_diagnostics: true
  track_weight: 1.5
  static_object_weight: 1.0
  vehicle_weight: 0.4
  person_weight: 0.2
  label_json: ""

semantic_calib:
  enabled: true
  # 语义链路启用时默认不允许静默回退 legacy，避免“看似成功但 breakdown 全 0”。
  allow_legacy_fallback: false
  pyramid_scales: [1.0, 0.5, 0.25]
  semantic_js_weight: 3.0
  histogram_weight: 0.5
  edge_weight: 1.0
  rail_weight: 1.2
  vehicle_object_weight: 0.8
  person_object_weight: 0.5
  allow_object_or_edge_to_pass_rail_gate: true
  min_final_object_visible_count: 1
  min_final_semantic_hist_similarity: 0.05
  max_final_semantic_js_divergence: 0.95
  min_image_rail_quality: 0.45
  low_image_rail_quality_weight: 0.0
  lidar_bev_crop_to_image_valid: true
  lidar_bev_crop_to_image_rail_bbox: true
  lidar_bev_image_rail_bbox_padding_m: 8.0
  anchor_fixed_sampling: true
  direction_aware_yaw_weighting: true
  class_weights:
    rail: 3.0
    ballast: 2.0
    pole: 2.0
    signal: 2.0
    platform: 1.5
    building: 1.0
    road: 0.8
    vehicle: 1.0
    person: 1.0
    vegetation: 0.2
    sky: 0.0

# ========================================
# 多帧滑动窗口精修（默认关闭）
# ========================================
refine:
  enabled: true
  window_size: 5
  min_observability_score: 0.35
  max_pose_jump_deg: 0.8
  max_pose_jump_m: 0.15
  temporal_smoothing_lambda: 0.4
  update_stride: 1
